name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  pinput: ^6.0.1
  shared_preferences: ^2.2.2
  lottie: ^3.1.0
  animated_text_kit: ^4.2.2
  provider: ^6.1.5+1
  path_provider: ^2.1.3

  # Firebase (STABLE + AGP 8/9 SAFE)
  # Firebase (needed for Phone OTP)
  firebase_core: ^3.4.1
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.4.0
  google_sign_in: ^6.2.1  
  firebase_storage: ^12.2.0 
  razorpay_flutter: ^1.3.5
  another_flushbar: ^1.12.30
  firebase_app_check: ^0.2.2


  # Location & permissions
  geolocator: ^10.1.0
  permission_handler: ^12.0.1
  geocoding: ^3.0.0

  # image picker
  image_picker: ^1.0.4



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

dependency_overrides:
  fluttertoast: 8.2.10


flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/lottie/



