name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  pinput: ^6.0.1
  shared_preferences: ^2.2.2
  lottie: ^3.1.0
  animated_text_kit: ^4.2.2
  provider: ^6.1.5+1

  # Firebase (STABLE + AGP 8/9 SAFE)
  firebase_core: ^3.15.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0

  # Location & permissions
  geolocator: ^12.0.0
  permission_handler: ^12.0.1
  geocoding: ^4.0.0

  # Backend
  supabase_flutter: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/lottie/
