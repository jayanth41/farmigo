name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  pinput: ^6.0.1
  shared_preferences: ^2.2.2
  lottie: ^3.1.0
  animated_text_kit: ^4.2.2
  provider: ^6.1.5+1
  path_provider: ^2.1.3

  # Firebase (STABLE + AGP 8/9 SAFE)
  # Firebase (needed for Phone OTP)
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  google_sign_in: ^6.2.1
  firebase_storage: ^11.6.0

  # Location & permissions
  geolocator: ^12.0.0
  permission_handler: ^12.0.1
  geocoding: ^4.0.0

  #image picker
  image_picker: ^1.0.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/lottie/
