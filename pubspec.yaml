name: skybase
description: "Skybase - Premium Property Management and Booking Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  pinput: ^6.0.1
  shared_preferences: ^2.2.2
  lottie: ^3.1.0
  animated_text_kit: ^4.2.2
  provider: ^6.1.5+1
  path_provider: ^2.1.3

  # Firebase (STABLE + AGP 8/9 SAFE)
  # Firebase (needed for Phone OTP)
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_sign_in: ^7.2.0  
  firebase_storage: ^13.0.6 
  firebase_messaging: ^16.1.1
  audioplayers: ^6.5.1
  # Temporarily removed flutter_local_notifications due to Android Gradle Plugin
  # compatibility issues (namespace required in plugin's Android manifest).
  # Re-add after upgrading plugin or AGP compatibility testing.
  razorpay_flutter: ^1.3.5
  another_flushbar: ^1.12.30
  firebase_app_check: ^0.4.1+4
  url_launcher: ^6.3.2
  pdf: ^3.10.7
  printing: ^5.12.0


  # Location & permissions
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  geocoding: ^4.0.0

  # image picker
  image_picker: ^1.2.1
  font_awesome_flutter: ^10.7.0
  # Charts
  fl_chart: ^0.69.0
  
  # Date formatting
  intl: ^0.19.0
  
  # Duffel Flight API
  http: ^1.1.0
  flutter_dotenv: ^5.1.0

  # Google Maps
  google_maps_flutter: ^2.14.2

  # Share
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  fluttertoast: 8.2.10


flutter:
  uses-material-design: true

  assets:
    - assets/



